name: Publish Dawn Island
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify island
        run: |
          for file in src/island/*.mjs scripts/*.cjs; do node --check "$file"; done
          node tests/island.test.mjs
      - name: Prepare island-only site
        run: |
          mkdir -p _site/src/island _site/assets/production/dawn _site/assets/production/phoenix _site/assets/fonts _site/screenshots
          cp index.html style.css _site/
          cp src/island/*.mjs _site/src/island/
          cp assets/production/manifest.json _site/assets/production/
          cp assets/production/dawn/world.png assets/production/dawn/props.png _site/assets/production/dawn/
          cp assets/production/phoenix/atlas.png _site/assets/production/phoenix/
          cp assets/fonts/VT323-Regular.ttf assets/fonts/VT323-OFL.txt _site/assets/fonts/
          cp assets/favicon.svg _site/assets/
          cp artifacts/dawn-{meadow,forest,ruins,beach,fire}.png _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
