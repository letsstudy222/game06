<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hải Uyên — Bản thử nghệ thuật và di chuyển</title><style>body{margin:0;background:#061b2b;color:#d6f6fb;font:14px system-ui;display:flex;align-items:center;justify-content:center;min-height:100svh}main{width:min(100%,650px);padding:8px;box-sizing:border-box}canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border:2px solid #64bdbd;background:#0c3851;touch-action:none}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:8px}button{background:#173d51;color:#fff;border:1px solid #66bbc0;border-radius:8px;padding:10px 14px;touch-action:manipulation}small{color:#9ac4d0}.pad{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:4px}.pad button{height:48px}.pad .empty{visibility:hidden}#status{min-height:2em}</style></head><body><main><div class="line"><strong>HẢI UYÊN · DEMO TƯƠNG TÁC</strong></div><canvas id="c" width="512" height="512"></canvas><div class="line"><button id="gateBtn">E · Mở / đóng cổng</button><button id="debugBtn">Hiện vùng cản</button><button id="reset">Về điểm đầu</button></div><div id="status" class="line"><small>WASD / phím mũi tên · Đến gần cổng rồi nhấn E · Cột có va chạm và che khuất theo chiều sâu.</small></div><div class="pad"><span class="empty">.</span><button data-key="arrowup">▲</button><span class="empty">.</span><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><div class="line"><small>Nguyên mẫu kỹ thuật từ Bước 14 · Quy chưa có đủ 8 hướng, chưa có combat, boss và bốn phòng.</small></div><div class="line"><a style="color:#9ee9ee" href="./">← Trang giới thiệu</a> · <a style="color:#9ee9ee" href="thu-vien.html">Thư viện thiết kế</a></div></main><script>
const M={"name": "Hải Uyên — Clean walkable ground proof 14", "status": "mechanics prototype — NOT art approved", "stage": 14, "canvas": [512, 512], "ground": "assets/floor_clean_512.png", "spawn": [256, 428], "playable_polygon": [[35, 145], [148, 100], [366, 100], [477, 145], [477, 477], [35, 477]], "player_radius": 11, "speed_px_s": 133, "gate": {"x": 188, "y": 18, "size": [135, 123], "interact_center": [256, 170], "interact_radius": 52, "frames": ["assets/gate_open_00.png", "assets/gate_open_01.png", "assets/gate_open_02.png", "assets/gate_open_03.png", "assets/gate_open_04.png", "assets/gate_open_05.png", "assets/gate_open_06.png", "assets/gate_open_07.png", "assets/gate_open_08.png"]}, "props": [{"id": "pillar_w", "asset": "pillar_moss.png", "x": 66, "y": 190, "footY": 318, "r": 22}, {"id": "pillar_e", "asset": "pillar_intact.png", "x": 348, "y": 190, "footY": 318, "r": 22}, {"id": "pillar_nw", "asset": "pillar_damaged.png", "x": 90, "y": 42, "footY": 170, "r": 22}, {"id": "rubble", "asset": "pillar_fallen.png", "x": 330, "y": 362, "footY": 458, "r": 31}], "player": {"asset": "assets/quy_reference_one_direction.png", "draw_size": [66, 66], "anchor": [33, 55]}, "limitations": ["Floor is a 16x16 fixed-layout metatile, not shuffleable autotile", "One-direction cutout for Quy, no 8-way sprite", "Walk polygon is authored for this 512px test scene; not Chapter I canon geometry", "Gate animation art sourced from concept cutout, not final mechanical doors", "No engine game06 integration or browser automation verification"]};const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let keys=new Set(),images={},ready=0,debug=false,gateFrame=0,goal=0,p={x:256,y:428};let t=performance.now();const paths=[M.ground,...M.gate.frames,...M.props.map(x=>'assets/'+x.asset),M.player.asset];for(const src of [...new Set(paths)]){const img=new Image();img.onload=()=>{ready++;};img.onerror=()=>{document.querySelector('#status').textContent='Không nạp được '+src};img.src=src;images[src]=img}
const poly=M.playable_polygon;function inside(x,y){let b=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],z=poly[j];if((a[1]>y)!=(z[1]>y)&&x<(z[0]-a[0])*(y-a[1])/(z[1]-a[1])+a[0])b=!b;}return b}
function clear(x,y){const r=M.player_radius;if(![[r,0],[-r,0],[0,r],[0,-r]].every(([dx,dy])=>inside(x+dx,y+dy)))return false;return M.props.every(it=>{const cx=it.x+(it.id==='rubble'?80:48);return Math.hypot(x-cx,y-it.footY)>it.r+r})}
function nearGate(){return Math.hypot(p.x-M.gate.interact_center[0],p.y-M.gate.interact_center[1])<=M.gate.interact_radius}
function toggle(){if(!nearGate()){document.querySelector('#status').textContent='Hãy đến gần cổng để tương tác.';return}goal=goal===8?0:8;document.querySelector('#status').textContent=goal?'Đang mở màn nước...':'Đang đóng màn nước...'}
function draw(){ctx.clearRect(0,0,512,512);ctx.drawImage(images[M.ground],0,0);const g=images[M.gate.frames[gateFrame]];if(g?.complete&&g.naturalWidth)ctx.drawImage(g,M.gate.x,M.gate.y);const ob=M.props.map(it=>({foot:it.footY,src:'assets/'+it.asset,x:it.x,y:it.y}));ob.push({foot:p.y,src:M.player.asset,x:p.x-M.player.anchor[0],y:p.y-M.player.anchor[1],w:66,h:66});ob.sort((a,b)=>a.foot-b.foot);for(const it of ob){const img=images[it.src];if(img?.complete&&img.naturalWidth)ctx.drawImage(img,it.x,it.y,it.w||img.width,it.h||img.height)}if(debug){ctx.fillStyle='#48d99235';ctx.strokeStyle='#6cf3a5';ctx.lineWidth=2;ctx.beginPath();poly.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.stroke();for(const it of M.props){ctx.beginPath();ctx.strokeStyle='#ff6688';ctx.arc(it.x+(it.id==='rubble'?80:48),it.footY,it.r+M.player_radius,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='#f9da70';ctx.beginPath();ctx.arc(...M.gate.interact_center,M.gate.interact_radius,0,Math.PI*2);ctx.stroke()}}
function tick(now){const dt=Math.min((now-t)/1000,.04);t=now;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;let nx=p.x+dx*M.speed_px_s*dt,ny=p.y+dy*M.speed_px_s*dt;if(clear(nx,p.y))p.x=nx;if(clear(p.x,ny))p.y=ny;if(gateFrame!=goal){window.acc=(window.acc||0)+dt;if(window.acc>.065){gateFrame+=Math.sign(goal-gateFrame);window.acc=0}}if(ready===new Set(paths).size)draw();requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)toggle()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelector('#gateBtn').onclick=toggle;document.querySelector('#debugBtn').onclick=()=>debug=!debug;document.querySelector('#reset').onclick=()=>{p={x:256,y:428};gateFrame=goal=0};for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;const press=e=>{e.preventDefault();keys.add(key);b.setPointerCapture?.(e.pointerId)},release=e=>{e.preventDefault();keys.delete(key)};b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}requestAnimationFrame(tick)
</script></body></html>
